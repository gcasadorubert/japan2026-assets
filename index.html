<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Japan 2026">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F6F8">
  <title>Japan 2026</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #F4F6F8; color: #111318; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 420px; text-align: center; background: white; border-radius: 24px; padding: 32px 24px; }
    img { width: 120px; height: 120px; object-fit: cover; border-radius: 24px; }
    h1 { margin: 20px 0 12px; font-size: 28px; }
    p { line-height: 1.6; color: #566170; }
    a { display: block; margin-top: 24px; padding: 16px; background: #1477F8; color: white; text-decoration: none; border-radius: 16px; font-weight: 700; }
    a:focus-visible { outline: 3px solid #111318; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="./apple-touch-icon.png" alt="C&amp;G" width="120" height="120">
    <h1>Japan 2026</h1>
    <p id="instructions">A Safari, toca Compartir i després «Afegir a la pantalla d’inici». Si apareix «Obrir com a Web App», deixa-ho activat.</p>
    <a id="open-app" href="https://script.google.com/macros/s/AKfycbxyN75yt9BoSKGPd67RZBUmYqw9yRf8eHIpDSDsffxrRCFYUMl_Nxo66EKvpWJBC8Al/exec">Obrir Japan 2026</a>
    <noscript><p>Pots obrir l’app amb el botó de dalt.</p></noscript>
  </main>
  <script>
    const standalone = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
    const manual = new URLSearchParams(window.location.search).get('manual') === '1';
    if (standalone && !manual) {
      document.getElementById('instructions').textContent = 'Obrint Japan 2026… Si no s’obre, toca el botó.';
      window.location.replace(document.getElementById('open-app').href);
    }
  </script>
</body>
</html>
